<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("smesh-site-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (_) {}
      location.replace("/agreement/");
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>смэш AI</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://smeshai.xyz/agreement/" />
  <meta http-equiv="refresh" content="0; url=/agreement/" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <style>
    :root { --bg: #f7f4ee; --text: #2a2620; --accent: #1f8f8b; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) { --bg: #15201f; --text: #e8e4d8; --accent: #4fd1c5; }
    }
    :root[data-theme="dark"] { --bg: #15201f; --text: #e8e4d8; --accent: #4fd1c5; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
    .spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2.5px solid var(--accent); border-top-color: transparent;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin: 0; font-size: 14px; opacity: .75; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner" aria-hidden="true"></div>
    <p>«Условия использования» заменены Пользовательским соглашением&hellip; Если ничего не произошло, <a href="/agreement/">нажмите сюда</a>.</p>
  </div>
</body>
</html>
